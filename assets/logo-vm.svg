<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Viação Motta Virtual</title><desc id="desc">Logo vetorial em verde, amarelo e branco com M amarelo e slogan Qualidade, Conforto e Segurança.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b7a35"/><stop offset="0.55" stop-color="#07572a"/><stop offset="1" stop-color="#032e18"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff39a"/><stop offset="0.25" stop-color="#ffe34c"/><stop offset="0.7" stop-color="#f6c900"/><stop offset="1" stop-color="#d9a900"/></linearGradient>
  <linearGradient id="greenStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17a34a"/><stop offset="1" stop-color="#08752f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#00160b" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1200" height="600" rx="48" fill="url(#bg)"/>
<ellipse cx="600" cy="120" rx="430" ry="90" fill="#ffffff" opacity="0.04" filter="url(#soft)"/>
<g filter="url(#shadow)">
  <path d="M270 292C205 142 395 58 575 100" fill="none" stroke="url(#greenStroke)" stroke-width="30" stroke-linecap="round"/>
  <path d="M510 100C735 60 915 150 900 310" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round"/>
  <path d="M292 333L390 148h68l72 135 72-135h68l98 185h-83l-54-108-63 112h-76l-63-112-54 108z" fill="url(#gold)" stroke="#cf9d00" stroke-width="7" stroke-linejoin="round"/>
  <path d="M405 166l-82 155h37l61-122 72 128h42l-11-21-66-140z" fill="#fff7b2" opacity="0.3"/>
</g>
<text x="600" y="425" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="3">VIAÇÃO MOTTA</text>
<text x="600" y="482" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" letter-spacing="18">VIRTUAL</text>
<line x1="210" y1="520" x2="990" y2="520" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
<text x="600" y="562" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="1.5">QUALIDADE, CONFORTO E SEGURANÇA</text>
</svg>